name: Commit Test Build

on:
    push:
        branches:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
              target:
                - name: ttgo-lora32-v21
                  chip: esp32
                # ↓↓↓ 新增 esp32c3 target ↓↓↓
                - name: esp32c3_DIY_1W_LoRa
                  chip: esp32c3
        steps:
            - uses: actions/checkout@v3

            # ↓↓↓ 新增：esp32c3编译前先apply patch ↓↓↓
            - name: Apply custom SPI patch (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              run: python3 apply_custom_pins.py
              
            - uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install PlatformIO Core
              run: pip install --upgrade platformio

            - name: Build target
              run: pio run -e ${{ matrix.target.name }}

            - name: Build FS
              run: pio run --target buildfs -e ${{ matrix.target.name }}
              
            - name: Upload FS
              uses: actions/upload-artifact@v4
              with:
                name: filesystem-esp32c3
                path: .pio/build/esp32c3_DIY_1W_LoRa/littlefs.bin
                retention-days: 30
              
            # ↓↓↓ 新增：上传固件到Artifacts（可选，不需要可删掉）↓↓↓
            - name: Upload firmware
              uses: actions/upload-artifact@v4
              with:
                name: firmware-${{ matrix.target.name }}
                path: |
                  .pio/build/${{ matrix.target.name }}/firmware.bin
                  .pio/build/${{ matrix.target.name }}/bootloader.bin
                  .pio/build/${{ matrix.target.name }}/partitions.bin
                retention-days: 30

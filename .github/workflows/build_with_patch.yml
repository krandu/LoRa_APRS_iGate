name: Commit Test Build
on:
    push:
        branches:
            - '*'
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
              target:
                - name: ttgo-lora32-v21
                  chip: esp32
                - name: esp32c3_DIY_1W_LoRa
                  chip: esp32c3
        steps:
            - uses: actions/checkout@v3

            - name: Apply custom pin config (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              run: python3 apply_custom_pins.py

            - name: Verify patched pins (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              run: |
                echo "===== board_pinout.h ====="
                cat variants/esp32c3_DIY_1W_LoRa/board_pinout.h

            - uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install PlatformIO Core
              run: pip install --upgrade platformio

            - name: Build target
              run: pio run -e ${{ matrix.target.name }}

            - name: Show partition table (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              run: |
                echo "===== Partition Table ====="
                python3 -c "
                import struct
                with open('.pio/build/${{ matrix.target.name }}/partitions.bin', 'rb') as f:
                    data = f.read()
                for i in range(0, len(data), 32):
                    row = data[i:i+32]
                    if len(row) < 32 or row[0] != 0xAA or row[1] != 0x50:
                        continue
                    name = row[4:20].rstrip(b'\x00').decode(errors='ignore')
                    offset = struct.unpack('<I', row[20:24])[0]
                    size = struct.unpack('<I', row[24:28])[0]
                    print(f'{name:16s} offset=0x{offset:06X}  size=0x{size:06X}')
                "

            - name: Compare spiffs.bin (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              run: |
                echo "=== 自己编译的 spiffs.bin ==="
                pio run --target buildfs -e ${{ matrix.target.name }}
                ls -lh .pio/build/${{ matrix.target.name }}/spiffs.bin
                md5sum .pio/build/${{ matrix.target.name }}/spiffs.bin

                echo "=== 官方 release spiffs.bin ==="
                wget -q https://github.com/richonguzman/LoRa_APRS_iGate/releases/latest/download/esp32c3_DIY_1W_LoRa.zip \
                  -O /tmp/official.zip
                unzip -o /tmp/official.zip -d /tmp/official/
                ls -lh "/tmp/official/installer/firmware/spiffs.bin"
                md5sum "/tmp/official/installer/firmware/spiffs.bin"

                echo "=== 对比结果 ==="
                self_md5=$(md5sum .pio/build/${{ matrix.target.name }}/spiffs.bin | awk '{print $1}')
                official_md5=$(md5sum "/tmp/official/installer/firmware/spiffs.bin" | awk '{print $1}')
                if [ "$self_md5" = "$official_md5" ]; then
                  echo "两个 spiffs.bin 完全一致 ✓"
                else
                  echo "两个 spiffs.bin 不同！"
                  echo "自编 md5: $self_md5"
                  echo "官方 md5: $official_md5"
                fi

                echo "=== 用官方 spiffs.bin 替换 ==="
                cp "/tmp/official/installer/firmware/spiffs.bin" \
                  .pio/build/${{ matrix.target.name }}/spiffs.bin

            - name: Generate factory bin (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              run: |
                pip install esptool
                SPIFFS_OFFSET=$(python3 -c "
                import struct
                with open('.pio/build/${{ matrix.target.name }}/partitions.bin', 'rb') as f:
                    data = f.read()
                for i in range(0, len(data), 32):
                    row = data[i:i+32]
                    if len(row) < 32 or row[0] != 0xAA or row[1] != 0x50:
                        continue
                    name = row[4:20].rstrip(b'\x00').decode(errors='ignore')
                    offset = struct.unpack('<I', row[20:24])[0]
                    if 'spiffs' in name.lower() or 'ffat' in name.lower() or 'fs' in name.lower():
                        print(hex(offset))
                        break
                ")
                echo "spiffs partition offset: $SPIFFS_OFFSET"
                esptool.py --chip esp32c3 merge_bin \
                  -o .pio/build/${{ matrix.target.name }}/factory.bin \
                  --flash_mode dio \
                  --flash_freq 80m \
                  --flash_size 4MB \
                  0x0000         .pio/build/${{ matrix.target.name }}/bootloader.bin \
                  0x8000         .pio/build/${{ matrix.target.name }}/partitions.bin \
                  0xe000         ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
                  0x10000        .pio/build/${{ matrix.target.name }}/firmware.bin \
                  $SPIFFS_OFFSET .pio/build/${{ matrix.target.name }}/spiffs.bin
                echo "factory.bin size:"
                ls -lh .pio/build/${{ matrix.target.name }}/factory.bin

            - name: Upload firmware
              uses: actions/upload-artifact@v4
              with:
                name: firmware-${{ matrix.target.name }}
                path: |
                  .pio/build/${{ matrix.target.name }}/firmware.bin
                  .pio/build/${{ matrix.target.name }}/bootloader.bin
                  .pio/build/${{ matrix.target.name }}/partitions.bin
                retention-days: 30

            - name: Upload FS image (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              uses: actions/upload-artifact@v4
              with:
                name: filesystem-${{ matrix.target.name }}
                path: .pio/build/${{ matrix.target.name }}/spiffs.bin
                retention-days: 30

            - name: Upload factory bin (esp32c3 only)
              if: matrix.target.name == 'esp32c3_DIY_1W_LoRa'
              uses: actions/upload-artifact@v4
              with:
                name: factory-${{ matrix.target.name }}
                path: .pio/build/${{ matrix.target.name }}/factory.bin
                retention-days: 30
